[package]
name = "webtest"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "0.8"
leptos_meta = "0.8"

axum = { version = "0.8", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }

bevy = { version = "0.19", optional = true, default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_image",
    "bevy_light",
    "bevy_log",
    "bevy_material",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_shader",
    "bevy_window",
    "bevy_winit",
    "reflect_auto_register",
    "tonemapping_luts",
    "webgl2",
    "zstd_rust",
] }
gloo-file = { version = "0.3", features = ["futures"], optional = true }
js-sys = { version = "0.3", optional = true }
leptos-bevy-canvas = { version = "0.6", optional = true }
openusd = { git = "https://github.com/mxpv/openusd", features = ["geom", "shade"], optional = true }
usd_bevy = { path = "../bevy_openusd/crates/usd_bevy", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["Document", "Element", "FileList", "HtmlElement", "HtmlInputElement", "Window"], optional = true }
zip = { version = "8.6", default-features = false, optional = true }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:bevy",
    "dep:console_error_panic_hook",
    "dep:gloo-file",
    "dep:js-sys",
    "dep:leptos-bevy-canvas",
    "dep:openusd",
    "dep:usd_bevy",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:zip",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "dep:axum",
    "dep:leptos_axum",
    "dep:tokio",
]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "webtest"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
